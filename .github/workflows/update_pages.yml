name: Update Data & Deploy Pages

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:
    inputs: {}
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/update_pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-24.04
    outputs:
      data-changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run incremental update
        run: |
          set +e
          SCRIPT_DIR="$GITHUB_WORKSPACE/scripts"
          if [ -f "$SCRIPT_DIR/update_data.py" ]; then
            cd "$SCRIPT_DIR"
            python update_data.py
            ec=$?
          else
            echo "⚠  未找到 scripts/update_data.py，跳过增量更新"
            ec=2
          fi
          set -e
          if [ "$ec" = "1" ]; then
            echo "::error::update_data.py failed"
            exit 1
          fi

      - name: Commit data changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "chore: update GKI kernel version data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Data updated."
          fi

  deploy-pages:
    needs: update-data
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Pull latest data
        run: git pull origin main || true

      - name: Prepare web/data directory
        run: |
          mkdir -p web/data
          if [ -d data ]; then
            cp -r data/. web/data/
            echo "Copied data/* -> web/data/"
          else
            echo "⚠  data/ 目录不存在，跳过复制"
          fi

      - name: Ensure minimum Pages content exists
        run: |
          mkdir -p web
          if [ -f web/index.html ]; then
            echo "web/index.html already exists, skip generating"
            exit 0
          fi
          T=web/index.html
          : > "$T"
          printf '<!doctype html>\n' >> "$T"
          printf '<html lang="zh-CN">\n' >> "$T"
          printf '<head>\n' >> "$T"
          printf '<meta charset="utf-8">\n' >> "$T"
          printf '<title>Kernel Build 数据页</title>\n' >> "$T"
          printf '<meta name="viewport" content="width=device-width,initial-scale=1">\n' >> "$T"
          printf '<style>\n' >> "$T"
          printf 'body { font-family: -apple-system,Segoe UI,Helvetica,Arial,sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; color:#222; }\n' >> "$T"
          printf 'h1 { border-bottom: 2px solid #3b82f6; padding-bottom: 10px; }\n' >> "$T"
          printf 'h2 { margin-top: 30px; }\n' >> "$T"
          printf '.card { background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding: 14px 18px; margin: 12px 0; }\n' >> "$T"
          printf '.v { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }\n' >> "$T"
          printf '</style>\n' >> "$T"
          printf '</head>\n' >> "$T"
          printf '<body>\n' >> "$T"
          printf '<h1>Kernel Build &middot; GKI 内核版本映射</h1>\n' >> "$T"
          printf '<p>自动拉取的 AOSP GKI 内核版本与 os_patch_level 映射，Android 12/13/14/15/16。</p>\n' >> "$T"
          printf '<div id="app">Loading...</div>\n' >> "$T"
          # 下面两行故意拆成 SCRIPT_OPEN/CLOSE，避免 YAML/工作流解析器误处理内嵌 script 标签
          SCRIPT_OPEN=$(printf '<%s>', 'script')
          SCRIPT_CLOSE=$(printf '</%s>', 'script')
          printf '%s\n' "$SCRIPT_OPEN" >> "$T"
          printf "fetch('data/android16/6.12.json').then(function(r){return r.json();}).then(function(){document.getElementById('app').innerHTML='OK: data loaded.';}).catch(function(){document.getElementById('app').innerHTML='WARN: no data dir, check Actions logs.';});\n" >> "$T"
          printf '%s\n' "$SCRIPT_CLOSE" >> "$T"
          printf '<h2>Data Files</h2>\n' >> "$T"
          printf '<div class="card"><ul class="v">\n' >> "$T"
          printf '<li><a href="data/android12/5.10.json">android12/5.10.json</a></li>\n' >> "$T"
          printf '<li><a href="data/android13/5.15.json">android13/5.15.json</a></li>\n' >> "$T"
          printf '<li><a href="data/android14/6.1.json">android14/6.1.json</a></li>\n' >> "$T"
          printf '<li><a href="data/android15/6.6.json">android15/6.6.json</a></li>\n' >> "$T"
          printf '<li><a href="data/android16/6.12.json">android16/6.12.json</a></li>\n' >> "$T"
          printf '<li><a href="data/announcement.json">announcement.json</a></li>\n' >> "$T"
          printf '</ul></div>\n' >> "$T"
          printf '</body>\n' >> "$T"
          printf '</html>\n' >> "$T"
          echo "Generated web/index.html ($(wc -c < "$T") bytes)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web assets (if package.json exists)
        working-directory: web
        run: |
          if [ -f package.json ]; then
            npm ci && npx webpack --mode production
          else
            echo "ℹ  无 package.json，跳过前端构建"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
